services:
  # --- 1. Database ---
  db:
    image: pgrouting/pgrouting:latest
    container_name: pgrouting_db
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./intersections.csv:/docker-entrypoint-initdb.d/intersections.csv
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- 2. Redis ---
  redis:
    image: redis:alpine
    container_name: redis_cache
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- 3. 백엔드 1 ---
  backend1:
    image: ${REGISTRY}/${ECR_REPOSITORY}:latest
    container_name: backend1
    expose:
      - "${SERVER_PORT}"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - ./logs/backend1:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      valhalla:
        condition: service_started
    restart: unless-stopped

  # --- 4. 백엔드 2 ---
  backend2:
    image: ${REGISTRY}/${ECR_REPOSITORY}:latest
    container_name: backend2
    expose:
      - "${SERVER_PORT}"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - ./logs/backend2:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      valhalla:
        condition: service_started
    restart: unless-stopped

  # --- 5. Nginx ---
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend1
      - backend2
    restart: unless-stopped
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # --- 6. Certbot ---
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    restart: unless-stopped
    depends_on:
      - nginx
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # --- 7. Prometheus ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  # --- 8. Grafana ---
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SERVER_DOMAIN=api.pacer.io.kr
      - GF_SERVER_ROOT_URL=https://api.pacer.io.kr/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_PROTOCOL=http
      - GF_SERVER_ENFORCE_DOMAIN=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # --- 9. Valhalla ---
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: valhalla_server
    volumes:
      - /home/ubuntu/pacer/pacer_map_data:/custom_files
    environment:
      - tile_urls=https://download.geofabrik.de/asia/south-korea-latest.osm.pbf
      - serve_tiles=True
      - build_by_default=True
      - use_tiles_ignore_pbf=False
    restart: always


volumes:
  pg_data:
  redis_data:
  grafana_data:
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/migration

jwt:
  secret: test-secret-key-minimum-32-bytes-long!!
  access-token-expire-ms: 3600000
  refresh-token-expire-ms: 1209600000

oauth:
  google:
    client-id: test-google-client-id
    client-secret: test-google-secret
    redirect-uri: http://localhost:3000/callback
  kakao:
    client-id: test-kakao-client-id
    client-secret: test-kakao-secret
    redirect-uri: http://localhost:3000/callback

cits:
  api-url: http://localhost:9999
  api-key: test-cits-key
  state-api-url: http://localhost:9999
  spbi:
    url: http://localhost:9999

valhalla:
  url: http://localhost:9999

ai:
  api-url: http://localhost:9999

subway:
  station-api-url: http://localhost:9999
  api-key: test-subway-key
  arrival-api-url: http://localhost:9999
  arrival-api-key: test-subway-arrival-key


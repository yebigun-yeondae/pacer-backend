spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_EXTERNAL_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_EXTERNAL_PORT}
      timeout: 3000ms

ai:
  api-url: http://localhost:8000

subway:
  api-key: ${SUBWAY_API_KEY:local-dev-subway-api-key}
  arrival-api-key: ${SUBWAY_ARRIVAL_API_KEY:local-dev-subway-arrival-api-key}

# cits:
#   state-api-url: http://localhost:8080
#   spbi:
#     url: http://localhost:8080

logging:
  level:
    kr.io.pacer: DEBUG

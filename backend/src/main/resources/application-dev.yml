spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_EXTERNAL_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_EXTERNAL_PORT}
      timeout: 3000ms

ai:
  api-url: http://localhost:8000

bus-stop:
  api-key: "temporary_mock_key_for_dev"

cits:
  state-api-url: http://localhost:8080
  spbi:
    url: http://localhost:8080
